name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - "v0.9.1-windows-exe"
      - "v0.11.0-subdomain-evidence"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DarthScanner --paths . darthscanner_gui.py
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/DarthScanner.exe release/
          @'
          DARTH SCANNER 0.11.0

          Run DarthScanner.exe to open the desktop dashboard.
          All scanning runs inside the desktop app. No terminal or separate engine is required.
          The application stores its reports and history in your Windows local app-data folder.

          Only scan websites you own or have explicit permission to assess.
          '@ | Set-Content release/README.txt
          Compress-Archive -Path release/* -DestinationPath DarthScanner-Windows-x64.zip -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarthScanner-Windows-x64
          path: DarthScanner-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DarthScanner-Windows-x64.zip

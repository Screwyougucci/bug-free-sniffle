[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "3.1.0"
description = "Scoped web/server security scanner with SPA JavaScript GET route discovery and multi-language interprocedural dataflow analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"
darth-graph = "darthscanner.graph_cli:main"

[tool.setuptools]
packages = ["darthscanner"]

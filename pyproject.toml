[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "0.3.0"
description = "Deterministic web and server security scanner with TLS checks, exposure discovery, and CVE matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"

[tool.setuptools]
packages = ["darthscanner"]

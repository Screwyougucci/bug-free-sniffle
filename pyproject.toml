[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "0.8.0"
description = "Deterministic web/server scanner with local zero-day research checks, TLS and CVE matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"

[tool.setuptools]
packages = ["darthscanner"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "2.0.0"
description = "Combined web and source security scanner with JavaScript and Python dataflow review, API inventory, bounded fuzzing, and evidence-focused reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"

[tool.setuptools]
packages = ["darthscanner"]

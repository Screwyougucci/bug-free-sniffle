[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "3.2.0"
description = "Scoped web/server security scanner with website form/input inventory, framework hints, SPA route discovery, and multi-language source analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"
darth-graph = "darthscanner.graph_cli:main"

[tool.setuptools]
packages = ["darthscanner"]

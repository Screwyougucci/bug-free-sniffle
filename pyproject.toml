[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "2.3.0"
description = "Deterministic web/server scanner with micro-vulnerability and project-wide interprocedural and cross-function taint analysis for Python, JavaScript, TypeScript, PHP, Java, and Go plus multi-language JavaScript, TypeScript, PHP, Java, Go, and Python source-to-sink analysis, cache/CORS review, API inventory, continuous watch, and Sigma-style log auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"

[tool.setuptools]
packages = ["darthscanner"]

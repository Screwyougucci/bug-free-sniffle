[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "3.4.0"
description = "Scoped web/server security scanner with browser-based application mapping, API relationships, website inventory, and multi-language source analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]

[project.scripts]
darth-scanner = "darthscanner.cli:main"
darth-graph = "darthscanner.graph_cli:main"

[tool.setuptools]
packages = ["darthscanner"]

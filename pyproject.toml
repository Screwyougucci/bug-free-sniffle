[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darth-scanner"
version = "0.17.0"
description = "Deterministic web/server scanner with adaptive fuzzing and evidence-based exploitability triage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darth-scanner = "darthscanner.cli:main"
darth-scanner-app = "darthscanner.app:main"

[tool.setuptools]
packages = ["darthscanner"]
